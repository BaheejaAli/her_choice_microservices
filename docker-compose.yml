services:

  user-service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    ports:
      - "8001:8001"

  product-service:
    build:
      context: .
      dockerfile: product_service/Dockerfile
    ports:
      - "8002:8002"

  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    ports:
      - "8003:8003"
    depends_on:
      - user-service
      - product-service
    environment:
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002

  api-gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - product-service
      - order-service
    environment:
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
      ORDER_SERVICE_URL: http://order-service:8003